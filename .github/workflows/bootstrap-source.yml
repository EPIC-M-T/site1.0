name: Bootstrap EPIC Models & Talent source

on:
  push:
    branches:
      - epic-models-and-talent-production
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: epic-models-and-talent-production
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.chunk* | base64 --decode > /tmp/epic-source.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name bootstrap ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/epic-source.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Validate build
        run: |
          npm run build
          npm run check

      - name: Commit editable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPIC Models & Talent Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add editable EPIC Models & Talent production source"
          git push origin HEAD:epic-models-and-talent-production
