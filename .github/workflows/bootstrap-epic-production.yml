name: Bootstrap EPIC production source

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack-source:
    if: github.head_ref == 'epic-models-and-talent-production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EPIC production branch
        uses: actions/checkout@v4
        with:
          ref: epic-models-and-talent-production
          fetch-depth: 0

      - name: Reconstruct editable source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d bootstrap ]; then
            echo "Source already unpacked."
            exit 0
          fi
          cat bootstrap/source.chunk* | base64 --decode > /tmp/epic-source.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name bootstrap ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/epic-source.tar.gz -C .
          rm -rf bootstrap
          rm -rf .github

      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check

      - name: Commit editable source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "EPIC Models & Talent Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add editable EPIC Models & Talent production source"
          git push origin HEAD:epic-models-and-talent-production
